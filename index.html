<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;color:#b8a888;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#c{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(14,8,4,.6),rgba(0,0,0,.94));z-index:5;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
.scr.on{display:flex}
h1{font-weight:400;font-size:min(13vw,62px);letter-spacing:.3em;text-indent:.3em;color:#c9a45c;text-transform:uppercase;text-shadow:0 0 30px rgba(255,110,20,.35),0 2px 0 #000;line-height:1.1}
h2{font-weight:400;font-size:min(9vw,40px);letter-spacing:.28em;text-indent:.28em;color:#c9a45c;text-transform:uppercase;text-shadow:0 2px 0 #000;margin-bottom:10px}
.rule{width:min(260px,60vw);height:1px;background:linear-gradient(90deg,transparent,#7a5c2e,transparent);margin:18px 0}
p.sub{font-size:13px;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:#7d6e55}
p.how{font-size:15px;line-height:1.7;color:#8f8268;max-width:330px;font-style:italic;margin-bottom:26px}
button{font:inherit;font-size:14px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:#c9a45c;background:rgba(20,12,6,.7);border:1px solid #7a5c2e;padding:14px 38px;cursor:pointer;margin:6px;touch-action:manipulation}
button:hover,button:active{background:rgba(120,80,30,.25);border-color:#c9a45c}
button:disabled{opacity:.45;cursor:default}
#cards{display:flex;flex-direction:column;gap:10px;width:min(380px,100%);margin-top:18px}
.card{padding:14px 16px;background:linear-gradient(#0f0b08,#080605);border:1px solid #4a3818;cursor:pointer;text-align:left;position:relative;touch-action:manipulation}
.card:hover,.card:active{border-color:#c9a45c;background:linear-gradient(#17100a,#0c0806)}
.card .nm{font-size:19px;letter-spacing:.12em;color:#d8b66a;text-transform:uppercase}
.card .lv{font-size:11px;letter-spacing:.3em;color:#7d6e55;margin:3px 0 6px;text-transform:uppercase}
.card .ds{font-size:14px;line-height:1.35;color:#9d9078;font-style:italic}
.card .key{position:absolute;top:8px;right:12px;color:#4a3818;font-size:13px}
#stats{font-size:17px;line-height:1.9;letter-spacing:.14em;margin:6px 0 20px;color:#9d9078}
#stats b{color:#c9a45c;font-weight:400}
#fps{position:fixed;left:4px;bottom:4px;color:#7f7;font:12px monospace;z-index:9;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="fps"></div>

<div class="scr on" id="title">
  <p class="sub">A Mechanic's Night Shift</p>
  <div class="rule"></div>
  <h1>Last<br>Light</h1>
  <div class="rule"></div>
  <p class="how">One thumb. Drag anywhere to steer.<br>The guns fire on their own; the rig swings its<br>machete and pounds the ground when bugs close in.<br>Push the stick to the outer ring to dash.<br>Survive until dawn.</p>
  <button id="startBtn" disabled>Forging…</button>
</div>

<div class="scr" id="lvl">
  <h2>Retrofit</h2>
  <p class="sub">Choose one</p>
  <div id="cards"></div>
</div>

<div class="scr" id="pause">
  <h2>Paused</h2>
  <button id="resumeBtn">Resume</button>
</div>

<div class="scr" id="over">
  <h2 id="overT">Rig Wrecked</h2>
  <div class="rule"></div>
  <div id="stats"></div>
  <div><button id="contBtn" style="display:none">Keep Fighting</button><button id="againBtn">Redeploy</button></div>
</div>

  const m = Math.min(1, Math.max(0, (d - 6) / 44)), ux = dx / (d || 1), uy = dy / (d || 1); stick.dx = ux * m; stick.dy = uy * m; stick.ux = ux; stick.uy = uy; stick.d = d; stick.out = d >= 76; });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; }; cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick); cv.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- main loop + adaptive quality ---------- */
let emaDt = 16.7, lastQ = 0, fpsN = 0, fpsT = 0; const fpsEl = $('fps'), showFps = /[?&]fps/.test(location.search); if (showFps) fpsEl.style.display = 'block';
function frame(now) {
  requestAnimationFrame(frame); const raw = now - lastT, dt = clamp((raw || 0) / 1000, 0, .05); lastT = now;
  if (READY && raw < 100 && raw > 0) { emaDt = emaDt * .96 + raw * .04; if (now - lastQ > 2500 && emaDt > 21 && Q > .6) { Q = Math.max(.6, Q - .15); lastQ = now; emaDt = 16.7; resize(); } }
  if (showFps) { fpsN++; if (now - fpsT > 500) { fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT)) + ' fps  q' + Q.toFixed(2) + '  en' + (G ? G.en.length : 0); fpsN = 0; fpsT = now; } }
  if (!G) newGame(true); if (!READY) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); return; }
  if (state === 'play' || state === 'title') update(dt); render();
}
resize(); newGame(true);
(async () => {
  const btn = $('startBtn'), tb = performance.now(); btn.textContent = 'Loading…'; let ok = false; try { ok = await loadAssets(); } catch (e) { ok = false; }
  window.__boot = { cached: ok, ms: Math.round(performance.now() - tb) };
  if (!ok) { await buildAssets(m => { btn.textContent = m; }); saveAssets(); } else READY = true;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { getChunk(i, j); } pumpChunks(9); btn.textContent = 'Deploy'; btn.disabled = false;
})();
requestAnimationFrame(t => { lastT = t; frame(t); });
