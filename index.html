<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;color:#b8a888;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#c{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(14,8,4,.6),rgba(0,0,0,.94));z-index:5;text-align:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
.scr.on{display:flex}
h1{font-weight:400;font-size:min(13vw,62px);letter-spacing:.3em;text-indent:.3em;color:#c9a45c;text-transform:uppercase;text-shadow:0 0 30px rgba(255,110,20,.35),0 2px 0 #000;line-height:1.1}
h2{font-weight:400;font-size:min(9vw,40px);letter-spacing:.28em;text-indent:.28em;color:#c9a45c;text-transform:uppercase;text-shadow:0 2px 0 #000;margin-bottom:10px}
.rule{width:min(260px,60vw);height:1px;background:linear-gradient(90deg,transparent,#7a5c2e,transparent);margin:18px 0}
p.sub{font-size:13px;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;color:#7d6e55}
p.how{font-size:15px;line-height:1.7;color:#8f8268;max-width:330px;font-style:italic;margin-bottom:26px}
button{font:inherit;font-size:14px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:#c9a45c;background:rgba(20,12,6,.7);border:1px solid #7a5c2e;padding:14px 38px;cursor:pointer;margin:6px;touch-action:manipulation}
button:hover,button:active{background:rgba(120,80,30,.25);border-color:#c9a45c}
button:disabled{opacity:.45;cursor:default}
#cards{display:flex;flex-direction:column;gap:10px;width:min(380px,100%);margin-top:18px}
.card{padding:14px 16px;background:linear-gradient(#0f0b08,#080605);border:1px solid #4a3818;cursor:pointer;text-align:left;position:relative;touch-action:manipulation}
.card:hover,.card:active{border-color:#c9a45c;background:linear-gradient(#17100a,#0c0806)}
.card .nm{font-size:19px;letter-spacing:.12em;color:#d8b66a;text-transform:uppercase}
.card .lv{font-size:11px;letter-spacing:.3em;color:#7d6e55;margin:3px 0 6px;text-transform:uppercase}
.card .ds{font-size:14px;line-height:1.35;color:#9d9078;font-style:italic}
.card .key{position:absolute;top:8px;right:12px;color:#4a3818;font-size:13px}
#stats{font-size:17px;line-height:1.9;letter-spacing:.14em;margin:6px 0 20px;color:#9d9078}
#stats b{color:#c9a45c;font-weight:400}
#fps{position:fixed;left:4px;bottom:4px;color:#7f7;font:12px monospace;z-index:9;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="fps"></div>

<div class="scr on" id="title">
  <p class="sub">A Mechanic's Night Shift</p>
  <div class="rule"></div>
  <h1>Last<br>Light</h1>
  <div class="rule"></div>
  <p class="how">One thumb. Drag anywhere to steer.<br>The guns fire on their own; the rig swings its<br>machete and pounds the ground when bugs close in.<br>Push the stick to the outer ring to dash.<br>Survive until dawn.</p>
  <button id="startBtn" disabled>Forging…</button>
</div>

<div class="scr" id="lvl">
  <h2>Retrofit</h2>
  <p class="sub">Choose one</p>
  <div id="cards"></div>
</div>

<div class="scr" id="pause">
  <h2>Paused</h2>
  <button id="resumeBtn">Resume</button>
</div>

<div class="scr" id="over">
  <h2 id="overT">Rig Wrecked</h2>
  <div class="rule"></div>
  <div id="stats"></div>
  <div><button id="contBtn" style="display:none">Keep Fighting</button><button id="againBtn">Redeploy</button></div>
</div>

  const rem = Math.max(0, EVAC - g.t), mm = Math.floor(rem / 60), ss = Math.floor(rem % 60); ctx.textAlign = 'center'; ctx.font = '15px Georgia,serif'; ctx.fillStyle = 'rgba(190,170,130,.8)'; ctx.fillText(`${mm}:${String(ss).padStart(2, '0')}`, W / 2, top + 22);
  ctx.textAlign = 'left'; ctx.font = '11px Georgia,serif'; ctx.fillStyle = 'rgba(150,130,100,.8)'; ctx.fillText('LV ' + g.level, 10, top + 18);
  // hull bar under the walker; two cooldown pips
  const bw = 54, bx = mx - bw / 2, by = my + 27, hp = clamp(g.hp / g.maxhp, 0, 1); ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 5); ctx.fillStyle = hp > .35 ? '#8c2a1e' : (Math.floor(t * 4) % 2 ? '#d03a24' : '#8c2a1e'); ctx.fillRect(bx, by, bw * hp, 3);
  { const pips = []; for (const id of ['stomp', 'vent']) if (g.wp[id]) { const L = MV[id][g.wp[id]]; pips.push({ fr: clamp(Math.max(0, g.mvT[id]) / (L.cd * Math.max(.45, g.cdM)), 0, 1), c: id === 'vent' ? '#e07a2a' : '#c8b890' }); } pips.push({ fr: clamp(g.dashCd / g.dashCdMax, 0, 1), c: '#9ad0ff' });
    pips.forEach((q, i) => { const x = mx + (i - (pips.length - 1) / 2) * 16, y = by + 11; ctx.strokeStyle = q.fr <= 0 ? '#d8b66a' : '#5a4a30'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.stroke(); if (q.fr <= 0) { ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, TAU); ctx.fill(); } else { ctx.strokeStyle = '#8a6a30'; ctx.beginPath(); ctx.arc(x, y, 4, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - q.fr)); ctx.stroke(); } }); }
  // radio line
  if (g.sub) { const a = clamp(Math.min(g.sub.t, 3.6 - g.sub.t) * 3, 0, 1); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.font = 'italic 13px Georgia,serif'; ctx.fillStyle = '#000'; ctx.fillText(g.sub.txt, W / 2 + 1, top + 51); ctx.fillStyle = '#b8a888'; ctx.fillText(g.sub.txt, W / 2, top + 50); ctx.globalAlpha = 1; }
  if (g.hint > 0 && !stick) { ctx.globalAlpha = clamp(g.hint, 0, 1) * .6; ctx.textAlign = 'center'; ctx.font = 'italic 14px Georgia,serif'; ctx.fillStyle = '#b8a888'; ctx.fillText('drag to move', W / 2, H * .84); ctx.globalAlpha = 1; }
  if (stick) { const rdy = g.dashCd <= 0 && !g.dash, hot = stick.out && rdy; ctx.globalAlpha = .28; ctx.strokeStyle = '#c9a45c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 50, 0, TAU); ctx.stroke();
    ctx.globalAlpha = hot ? .75 : (rdy ? .3 : .12); ctx.strokeStyle = hot ? '#9ad0ff' : '#c9a45c'; ctx.setLineDash(rdy ? [] : [4, 6]); ctx.lineWidth = hot ? 2.2 : 1.2; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 76, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = .45; ctx.fillStyle = hot ? '#9ad0ff' : '#c9a45c'; ctx.beginPath(); ctx.arc(stick.ox + stick.ux * Math.min(stick.d, 92), stick.oy + stick.uy * Math.min(stick.d, 92), 14, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
}

/* =====================================================================
   UI FLOW
   ===================================================================== */
const $ = id => document.getElementById(id);
function show(id) { for (const s of document.querySelectorAll('.scr')) s.classList.toggle('on', s.id === id); }
function startGame() { if (!READY) return; initAudio(); newGame(false); state = 'play'; show(''); say(pick(LINES.start), true); lastT = performance.now(); }
let offers = [];
function openLevelUp() {
  const g = G; g.pend--; state = 'levelup'; sfx.level(); stick = null; const pool = [];
  for (const id of ITEM_IDS) { const lv = ITEMS[id].w ? (g.wp[id] || 0) : (g.ps[id] || 0); if (lv < MAXLV(id)) pool.push({ id, lv }); }
  pool.sort(() => Math.random() - .5); offers = pool.slice(0, 3); if (!offers.length) offers = [{ id: 'heal', lv: 0 }];
  const box = $('cards'); box.innerHTML = '';
  offers.forEach((o, i) => { const it = ITEMS[o.id] || { n: 'Field Repairs', d: ['Restore half your hull.'] }, c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="nm">${(it.names && it.names[o.lv]) || it.n}</div><div class="lv">${o.id === 'heal' ? 'one-time' : (o.lv ? `Level ${o.lv} → ${o.lv + 1}` : 'New')}${it.auto ? ' · automatic' : ''}</div><div class="ds">${it.d[o.lv] || it.d[0]}</div><div class="key">${i + 1}</div>`;
    c.addEventListener('pointerup', ev => { ev.preventDefault(); chooseOffer(i); }); box.appendChild(c); });
  show('lvl');
}
function chooseOffer(i) { if (state !== 'levelup' || !offers[i]) return; const g = G, o = offers[i]; if (o.id === 'heal') g.hp = Math.min(g.maxhp, g.hp + g.maxhp * .5); else if (ITEMS[o.id].w) g.wp[o.id] = (g.wp[o.id] || 0) + 1; else g.ps[o.id] = (g.ps[o.id] || 0) + 1; recalc(); say(pick(LINES.level)); state = 'play'; show(''); lastT = performance.now(); }
function endGame(win) {
  const g = G; state = 'over'; stick = null; const best = +(localStorage.getItem('iv_best') || 0); if (g.t > best) localStorage.setItem('iv_best', Math.floor(g.t));
  $('overT').textContent = win ? 'Dawn Breaks' : 'Rig Wrecked'; const f = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  $('stats').innerHTML = (win ? 'You held the pad.<br>' : '') + `Survived <b>${f(g.t)}</b><br>Slain <b>${g.kills}</b> · Level <b>${g.level}</b><br>Best <b>${f(Math.max(best, g.t))}</b>`; $('contBtn').style.display = win ? '' : 'none'; if (win) say(pick(LINES.win), true); show('over');
}
$('startBtn').onclick = startGame; $('againBtn').onclick = startGame; $('resumeBtn').onclick = () => { state = 'play'; show(''); lastT = performance.now(); }; $('contBtn').onclick = () => { state = 'play'; show(''); lastT = performance.now(); };
function togglePause() { if (state === 'play') { state = 'paused'; stick = null; show('pause'); } else if (state === 'paused') { state = 'play'; show(''); lastT = performance.now(); } }
addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault(); if ((k === 'shift' || k === ' ') && state === 'play') keyDash(); if (k === 'p' || k === 'escape') togglePause(); if (k === 'm') { muted = !muted; if (master) master.gain.value = muted ? 0 : .5; } if (state === 'levelup' && ['1', '2', '3'].includes(k)) chooseOffer(+k - 1); if (state === 'title' && (k === 'enter' || k === ' ')) startGame(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; }); addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
cv.addEventListener('pointerdown', e => { if (state !== 'play' || stick) return; cv.setPointerCapture(e.pointerId); const r = cv.getBoundingClientRect(); stick = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, dx: 0, dy: 0, ux: 0, uy: 0, d: 0, out: false }; });
cv.addEventListener('pointermove', e => { if (!stick || e.pointerId !== stick.id) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, RMAX = 92; let dx = x - stick.ox, dy = y - stick.oy, d = Math.hypot(dx, dy);
  if (d > RMAX) { stick.ox += dx / d * (d - RMAX); stick.oy += dy / d * (d - RMAX); dx = x - stick.ox; dy = y - stick.oy; d = Math.hypot(dx, dy) || 1; }
  const m = Math.min(1, Math.max(0, (d - 6) / 44)), ux = dx / (d || 1), uy = dy / (d || 1); stick.dx = ux * m; stick.dy = uy * m; stick.ux = ux; stick.uy = uy; stick.d = d; stick.out = d >= 76; });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; }; cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick); cv.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- main loop + adaptive quality ---------- */
let emaDt = 16.7, lastQ = 0, fpsN = 0, fpsT = 0; const fpsEl = $('fps'), showFps = /[?&]fps/.test(location.search); if (showFps) fpsEl.style.display = 'block';
function frame(now) {
  requestAnimationFrame(frame); const raw = now - lastT, dt = clamp((raw || 0) / 1000, 0, .05); lastT = now;
  if (READY && raw < 100 && raw > 0) { emaDt = emaDt * .96 + raw * .04; if (now - lastQ > 2500 && emaDt > 21 && Q > .6) { Q = Math.max(.6, Q - .15); lastQ = now; emaDt = 16.7; resize(); } }
  if (showFps) { fpsN++; if (now - fpsT > 500) { fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT)) + ' fps  q' + Q.toFixed(2) + '  en' + (G ? G.en.length : 0); fpsN = 0; fpsT = now; } }
  if (!G) newGame(true); if (!READY) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height); return; }
  if (state === 'play' || state === 'title') update(dt); render();
}
resize(); newGame(true);
(async () => {
  const btn = $('startBtn'); await buildAssets(m => { btn.textContent = m; });
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { getChunk(i, j); } pumpChunks(9); btn.textContent = 'Deploy'; btn.disabled = false;
})();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
