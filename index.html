<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1124">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--ink:#090b14;--night:#131933;--cream:#f4e7c5;--dim:#b9b3a6;--orange:#e8622c;--crimson:#ff3b5c;--teal:#3ed0bd;--ts:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--ts))}
html,body{height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none;color:var(--cream);
  font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#c{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;
  background:rgba(9,11,20,.88);padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.scr.on{display:flex}
.scr.top{justify-content:flex-start}
h1{font-weight:800;font-size:min(24vw,6.4rem);line-height:.84;letter-spacing:.02em;text-transform:uppercase;color:var(--cream)}
h1 span{display:block;color:var(--orange)}
h2{font-weight:800;font-size:min(13vw,3.2rem);line-height:.9;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.tag{font-weight:700;font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin:14px 0 18px}
.how{list-style:none;max-width:320px;margin:0 0 22px;font-size:1.05rem;line-height:1.35;color:var(--dim);text-align:left}
.how li{padding:7px 0 7px 22px;position:relative;border-top:2px solid rgba(244,231,197,.14)}
.how li:first-child{border-top:0}
.how li::before{content:"";position:absolute;left:2px;top:.95em;width:9px;height:9px;background:var(--orange);transform:rotate(45deg)}
button{font:inherit;font-weight:800;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);background:transparent;
  border:3px solid var(--cream);padding:13px 30px;margin:6px;min-height:50px;min-width:50px;cursor:pointer;touch-action:manipulation}
button.go{background:var(--orange);border-color:var(--orange);color:var(--ink);font-size:1.25rem;padding:15px 46px}
button.alt{border-width:2px;font-size:.85rem;color:var(--dim);border-color:rgba(244,231,197,.45)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
#cards{display:flex;flex-direction:column;gap:10px;width:min(390px,100%);margin:14px 0 8px}
.card{display:block;width:100%;margin:0;padding:12px 14px 13px 20px;text-align:left;letter-spacing:0;text-transform:none;font-weight:400;
  background:var(--ink);border:3px solid var(--cream);position:relative;min-height:64px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--orange)}
.card.lamp::before{background:var(--cream)}.card.body::before{background:var(--teal)}
.card .nm{font-weight:800;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cream)}
.card .lv{font-weight:700;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin:2px 0 5px}
.card .ds{font-size:1rem;line-height:1.3;color:var(--dim)}
.card .kn{position:absolute;top:8px;right:12px;font-weight:800;color:rgba(244,231,197,.4)}
#stats{font-size:1.1rem;line-height:1.7;color:var(--dim);margin:8px 0 18px}
#stats b{color:var(--cream);font-weight:800}
#build{width:min(390px,100%);text-align:left;margin:4px 0 14px;color:var(--dim)}
#build li{list-style:none;padding:6px 0;border-top:2px solid rgba(244,231,197,.14)}
#build b{color:var(--cream);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#setBody{width:min(460px,100%);text-align:left;margin:10px 0 14px}
#setBody fieldset{border:2px solid rgba(244,231,197,.35);margin:0 0 14px;padding:10px 14px 6px}
#setBody legend{padding:0 8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.9rem;color:var(--cream)}
#setBody .note{font-size:.9rem;color:var(--dim);margin:2px 0 8px}
#setBody .row{padding:8px 0;border-top:2px solid rgba(244,231,197,.12)}
#setBody .row:first-of-type{border-top:0}
#setBody label{display:flex;align-items:center;gap:12px;min-height:44px;font-size:1.05rem;cursor:pointer}
#setBody label.lb{display:block;min-height:0;margin-bottom:4px}
#setBody input[type=checkbox]{width:28px;height:28px;accent-color:var(--orange);flex:none}
#setBody input[type=range]{width:100%;height:36px;accent-color:var(--orange)}
#setBody select{width:100%;min-height:44px;font:inherit;font-size:1rem;background:var(--ink);color:var(--cream);border:2px solid var(--cream);padding:6px 8px}
#setBody output{float:right;font-weight:800}
#setBody small{display:block;color:var(--dim);font-size:.88rem;line-height:1.35;margin-top:2px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.presets button{padding:9px 14px;margin:0}
#fps{position:fixed;left:4px;bottom:4px;color:#7f7;font:12px monospace;z-index:9;display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app">
<canvas id="c" role="img" aria-label="Game view. A lantern-headed walking machine holds back a swarm of bugs at night. Events, upgrades and results are announced as text."></canvas>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<noscript><p style="padding:2rem">Last Light needs JavaScript to run.</p></noscript>
<div id="probe"></div>
<div id="fps"></div>

<div class="scr on" id="title">
  <h1>Last<span>Light</span></h1>
  <p class="tag">Hold out until dawn</p>
  <ul class="how">
    <li>Drag anywhere to walk. Your lamp swings to the nearest bug.</li>
    <li>The gun only hits what the light touches.</li>
    <li>Red hatching marks an attack. Step out of it, or dash.</li>
  </ul>
  <button id="startBtn" class="go" data-autofocus>Start</button>
  <button id="setBtn1" class="alt">Settings &amp; accessibility</button>
</div>

<div class="scr top" id="lvl" role="dialog" aria-modal="true" aria-labelledby="lvlT">
  <h2 id="lvlT">Upgrade</h2>
  <p class="tag" id="lvlSub">Choose one</p>
  <div id="cards"></div>
</div>

<div class="scr top" id="pause" role="dialog" aria-modal="true" aria-labelledby="pauseT">
  <h2 id="pauseT">Paused</h2>
  <ul id="build" aria-label="Your upgrades"></ul>
  <button id="resumeBtn" class="go" data-autofocus>Resume</button>
  <button id="setBtn2" class="alt">Settings &amp; accessibility</button>
  <button id="quitBtn" class="alt">End run</button>
</div>

<div class="scr top" id="settings" role="dialog" aria-modal="true" aria-labelledby="setT">
  <h2 id="setT">Settings</h2>
  <p class="tag">Saved on this device</p>
  <div class="presets" role="group" aria-label="Presets"><button id="preCalm" class="alt">Calm preset</button><button id="preVis" class="alt">High-visibility preset</button><button id="preReset" class="alt">Reset all</button></div>
  <div id="setBody"></div>
  <button id="setBack" class="go">Back</button>
</div>

<div class="scr" id="over" role="dialog" aria-modal="true" aria-labelledby="overT">
  <h2 id="overT">Lights out</h2>
  <div id="stats"></div>
  <button id="againBtn" class="go" data-autofocus>Again</button>
  <button id="setBtn3" class="alt">Settings &amp; accessibility</button>
</div>
</main>

<script>
'use strict';
/* =====================================================================
   LAST LIGHT — a portrait, one-thumb survivors game.
   Everything is flat vector art drawn live: no sprites, no gradients, no blur.
   The idea the whole game hangs on: the gun only hits what the lamp lights.
   ===================================================================== */
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, IX = .82, IY = .44;            // ground projection: screen = ((x - y) * IX, (x + y) * IY)
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a), irand = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const ease = u => u * u * (3 - 2 * u);
function hash(x, y, s) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 11, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mix(a, b, t) { const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); }

/* ---------- settings (accessibility is part of the design, not a menu bolted on) ---------- */
const DEF = { shake: 1, hitstop: true, flash: false, particles: 1, gore: true, bright: 0, contrast: false, text: 1, nums: false, arrows: true, caps: true, vol: 1, sfxv: 1, musv: 1, haptics: true, hand: 'right', btn: 1, fixed: false, dead: 8, tscale: 1, dmg: 1, espd: 1, ecount: 1 };
function mq(q) { try { return !!(window.matchMedia && matchMedia(q).matches); } catch (e) { return false; } }
function defaultSettings() { const d = Object.assign({}, DEF); if (mq('(prefers-reduced-motion: reduce)')) { d.shake = 0; d.hitstop = false; d.flash = true; d.particles = .5; } if (mq('(prefers-contrast: more)')) { d.contrast = true; d.bright = .3; } return d; }
let ST = defaultSettings();
try { const o = JSON.parse(localStorage.getItem('ll2_settings')); if (o && o.v === 1) for (const k in DEF) if (k in o.s && typeof o.s[k] === typeof DEF[k]) ST[k] = o.s[k]; } catch (e) { }
function saveSettings() { try { localStorage.setItem('ll2_settings', JSON.stringify({ v: 1, s: ST })); } catch (e) { } }

/* ---------- palette: nine flat colours. LIT is what the lamp shows, DIM is the edge of the light, DARK is a silhouette with eyes ---------- */
const C0 = { ink: '#090b14', night: '#131933', night2: '#1c2548', dusk: '#3d3c58', dusk2: '#4c4a66', lit: '#b9a06c', lit2: '#a1895a', lit3: '#d0b981',
  cream: '#f4e7c5', orange: '#e8622c', orangeD: '#b5421d', steel: '#3b4563', steelL: '#6672a0', crimson: '#ff3b5c', plum: '#3b2749', plumL: '#5e3d72', teal: '#3ed0bd', amber: '#ffc94a' };
let C = C0, LIT, DIM, DARK, FLASH;
function buildPalettes() {
  const b = ST.bright, hc = ST.contrast;
  C = Object.assign({}, C0, { night: mix(C0.night, '#2b3564', b * .8 + (hc ? .25 : 0)), night2: mix(C0.night2, '#3a467c', b * .8 + (hc ? .25 : 0)) });
  LIT = Object.assign({}, C, { line: C.ink, eye: C.crimson });
  DIM = {}; for (const k in C) DIM[k] = mix(C[k], '#1a2145', .56); DIM.line = C.ink; DIM.eye = C.crimson; DIM.ink = C.ink;
  DARK = {}; for (const k in C) DARK[k] = hc ? '#000000' : C.ink; DARK.line = hc ? C.cream : C.ink; DARK.eye = C.crimson; DARK.dark = true;
  FLASH = {}; for (const k in C) FLASH[k] = C.cream; FLASH.line = C.ink; FLASH.eye = C.ink; FLASH.ink = C.ink;
}

/* ---------- view ---------- */
const DPR0 = Math.min(window.devicePixelRatio || 1, 3);
let W = 0, H = 0, RS = 1, Q = 1, Z = 1, OX = 0, OY = 0, SAFE = 0, camX = 0, camY = 0;
function resize() {
  W = Math.min(innerWidth, Math.round(innerHeight * .62)); H = innerHeight; RS = DPR0 * Q;
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  Z = clamp(W / 430, .78, 1.3); OX = W / 2; OY = H * .5; SAFE = parseFloat(getComputedStyle($('probe')).paddingTop) || 0;
}
addEventListener('resize', resize);
const SX = (x, y) => (x - y) * IX - camX, SY = (x, y) => (x + y) * IY - camY;
const FONT = '"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';

/* ---------- audio (synthesised) ---------- */
let AC = null, master = null, sfxBus = null, musBus = null, noiseBuf = null, muted = false, lastHitSnd = 0, lastShotSnd = 0, pickN = 0, pickT = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); sfxBus = AC.createGain(); musBus = AC.createGain(); sfxBus.connect(master); musBus.connect(master); applyAudio();
    const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; startMusic(); } catch (e) { AC = null; }
}
function applyAudio() { if (!AC) return; master.gain.value = muted ? 0 : .5 * ST.vol; sfxBus.gain.value = ST.sfxv; musBus.gain.value = ST.musv; }
function tone(f, d, type, v, slide, at) { if (!AC || muted) return; at = at || AC.currentTime; const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, at); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), at + d); g.gain.setValueAtTime(v || .1, at); g.gain.exponentialRampToValueAtTime(.001, at + d); o.connect(g); g.connect(sfxBus); o.start(at); o.stop(at + d + .03); }
function noise(d, v, fc, type, at, sweep) { if (!AC || muted) return; at = at || AC.currentTime; const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(fc || 1200, at); if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, fc + sweep), at + d); const g = AC.createGain(); g.gain.setValueAtTime(v || .2, at); g.gain.exponentialRampToValueAtTime(.001, at + d); s.connect(f); f.connect(g); g.connect(sfxBus); s.start(at, Math.random()); s.stop(at + d + .03); }
const sfx = {
  shot() { const n = performance.now(); if (n - lastShotSnd < 60) return; lastShotSnd = n; noise(.06, .2, 2600, 'bandpass'); tone(150 + Math.random() * 20, .09, 'square', .09, -90); },
  hit() { const n = performance.now(); if (n - lastHitSnd < 50) return; lastHitSnd = n; noise(.05, .1, 1400, 'lowpass'); tone(210, .05, 'triangle', .07, -90); },
  kill() { noise(.12, .14, 700, 'lowpass', 0, -400); tone(120, .1, 'triangle', .1, -60); },
  step() { tone(62, .09, 'sine', .16, -20); noise(.05, .05, 300, 'lowpass'); },
  dash() { noise(.25, .2, 2000, 'bandpass', 0, -1500); tone(130, .2, 'sawtooth', .1, 140); },
  hurt() { noise(.3, .3, 420, 'lowpass', 0, -250); tone(88, .3, 'sawtooth', .16, -50); if (ST.haptics && navigator.vibrate) navigator.vibrate(25); },
  thud() { tone(58, .25, 'sine', .4, -30); noise(.2, .3, 260, 'lowpass', 0, -200); },
  boom() { noise(.45, .4, 900, 'lowpass', 0, -700); tone(66, .4, 'sine', .3, -40); },
  spit() { noise(.2, .1, 1100, 'bandpass', 0, 600); tone(190, .22, 'sine', .08, 300); },
  splat() { noise(.25, .16, 520, 'lowpass'); },
  tell() { tone(330, .12, 'square', .05, -110); },
  flare() { noise(.3, .12, 1800, 'bandpass', 0, 1200); tone(520, .25, 'sine', .05, 400); },
  pick() { const n = performance.now(); pickN = n - pickT < 400 ? Math.min(10, pickN + 1) : 0; pickT = n; tone(620 * Math.pow(1.06, pickN), .07, 'triangle', .045); },
  level() { [392, 523, 659, 784].forEach((f, i) => tone(f, .2, 'triangle', .09, 0, AC && AC.currentTime + i * .08)); },
};
function startMusic() {
  const bass = [55, 55, 65.4, 55, 73.4, 55, 82.4, 49]; let step = 0, next = AC.currentTime + .15;
  setInterval(() => { if (!AC) return; while (next < AC.currentTime + .3) {
    if (!muted && (state === 'play' || state === 'title')) { const k = state === 'play' && G ? Math.min(1, G.t / 300) : .1, f = bass[step % 8] * (step % 32 >= 24 ? 1.122 : 1);
      const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.setValueAtTime(240 + k * 600, next); lp.frequency.exponentialRampToValueAtTime(110, next + .25);
      g.gain.setValueAtTime(.09, next); g.gain.exponentialRampToValueAtTime(.001, next + .26); o.connect(lp); lp.connect(g); g.connect(musBus); o.start(next); o.stop(next + .28); }
    step++; next += .27; } }, 100);
}

/* ---------- upgrades: a short list, and every one changes what you see ---------- */
const UPS = [
  { id: 'twin', kind: 'gun', n: 'Twin Barrels', max: 1, d: ['Fire two rounds side by side.'] },
  { id: 'slug', kind: 'gun', n: 'Slug Rounds', max: 3, d: ['+35% damage and a harder shove.'] },
  { id: 'load', kind: 'gun', n: 'Auto-Loader', max: 3, d: ['+22% fire rate.'] },
  { id: 'drill', kind: 'gun', n: 'Drill Tips', max: 2, d: ['Rounds punch through one more bug.'] },
  { id: 'wide', kind: 'lamp', n: 'Wide Lens', max: 2, d: ['The lamp cone is 25% wider.'] },
  { id: 'long', kind: 'lamp', n: 'Long Throw', max: 2, d: ['The lamp reaches 25% further.'] },
  { id: 'scorch', kind: 'lamp', n: 'Scorch Lens', max: 2, d: ['Bugs caught in the lamp burn.', 'The lamp burns twice as hot.'] },
  { id: 'servo', kind: 'lamp', n: 'Fast Servos', max: 2, d: ['The lamp swings 50% faster.'] },
  { id: 'flare', kind: 'lamp', n: 'Flare Mortar', max: 3, d: ['Every 9 s, lob a flare at bugs hiding in the dark. It lights the ground for 5 s.', 'A flare every 6.5 s.', 'A flare every 4.5 s, and a wider pool of light.'] },
  { id: 'dash', kind: 'body', n: 'Hot Dash', max: 2, d: ['Dash recharges 30% faster.', 'Dashing through bugs smashes them aside.'] },
  { id: 'plate', kind: 'body', n: 'Riveted Plating', max: 3, d: ['+25 hull, and patch 25 now.'] },
  { id: 'magnet', kind: 'body', n: 'Magnet Coil', max: 2, d: ['Pull in shards from twice as far.'] },
];
const UP = {}; for (const u of UPS) UP[u.id] = u;
const NEED = l => Math.round(10 + 8 * l + 1.2 * l * l);
const DAWN = 360;

/* ---------- state ---------- */
let state = 'title', G = null, lastT = 0, stick = null, dbtn = null; const keys = {};
function newGame(demo) {
  G = { demo, t: demo ? 40 : 0, x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxhp: 100, inv: 0, hurt: 0, lampA: -.6, aim: -.6, kick: 0, flashT: 0, fireAcc: 0, bob: 0,
    dash: null, dashCd: 0, ghosts: [], feet: [{ x: -9, y: 9, st: 0, lift: 0 }, { x: 9, y: -9, st: 0, lift: 0 }], stepSnd: 0, puffT: 0,
    en: [], bl: [], globs: [], shards: [], decals: [], gems: [], flares: [], puffs: [], pops: [],
    level: 1, xp: 0, need: NEED(1), pend: 0, up: {}, kills: 0, id: 1, spawnAcc: 0, spitT: 6, bruteT: 4, surgeI: 0, flareT: 3, scorchT: 0,
    shake: 0, freeze: 0, cap: null, won: false, hint: 7, nearR: 96, S: null, seen: {} };
  recalc(); return G;
}
function recalc() {
  const g = G, u = id => g.up[id] || 0, old = g.maxhp;
  g.S = { dmg: 11 * (1 + .35 * u('slug')), kb: 1 + .5 * u('slug'), rate: 5.2 * (1 + .22 * u('load')), pierce: u('drill'), twin: u('twin') > 0,
    coneHalf: .5 * (1 + .25 * u('wide')), coneR: 390 * (1 + .25 * u('long')), turn: 3.4 * (1 + .5 * u('servo')), scorch: [0, 7, 14][u('scorch')],
    flareCd: [0, 9, 6.5, 4.5][u('flare')], flareR: u('flare') >= 3 ? 175 : 145, dashCd: 2.6 * (1 - .3 * Math.min(1, u('dash'))), shove: u('dash') >= 2, mag: 80 * (1 + u('magnet')), spd: 165 };
  g.maxhp = 100 + 25 * u('plate'); if (g.maxhp > old) g.hp = Math.min(g.maxhp, g.hp + (g.maxhp - old));
}
function announce(t) { const l = $('live'); if (!l) return; l.textContent = ''; setTimeout(() => { l.textContent = t; }, 40); }
function cap(txt, always) { const g = G; if (!g || g.demo) return; if (ST.caps || always) g.cap = { txt, t: 2.6 }; announce(txt); }

/* ---------- light: the lamp cone, a small pool round the rig, fires and flares. Hard edges, two steps. ---------- */
const LIGHTS = [];
function lightAt(x, y) {
  const g = G, S = g.S, dx = x - g.x, dy = y - g.y, d = Math.hypot(dx, dy); let lv = 0;

    { k: 'vol', t: 'range', l: 'Master volume', min: 0, max: 100, step: 5, sc: 100, fmt: v => v + '%' }, { k: 'sfxv', t: 'range', l: 'Effects volume', min: 0, max: 100, step: 5, sc: 100, fmt: v => v + '%' }, { k: 'musv', t: 'range', l: 'Music volume', min: 0, max: 100, step: 5, sc: 100, fmt: v => v + '%' },
    { k: 'haptics', t: 'toggle', l: 'Vibration', d: 'A short buzz when you are hit.' } ] },
  { g: 'Controls', items: [
    { k: 'hand', t: 'select', l: 'Dash button side', opts: [['right', 'Right'], ['left', 'Left']], d: 'A fixed joystick uses the opposite corner.' },
    { k: 'btn', t: 'select', l: 'Dash button size', opts: [[1, 'Normal'], [1.25, 'Large'], [1.5, 'Extra large']] },
    { k: 'fixed', t: 'toggle', l: 'Fixed joystick', d: 'The joystick stays in one corner instead of appearing where you touch.' },
    { k: 'dead', t: 'range', l: 'Joystick dead zone', min: 2, max: 24, step: 2, fmt: v => v + ' px', d: 'How far to move your thumb before the rig responds.' } ] },
  { g: 'Assists', note: 'Change these at any time, including mid-run.', items: [
    { k: 'tscale', t: 'select', l: 'Game speed', opts: [[1, '100%'], [.85, '85%'], [.7, '70%'], [.55, '55%']], d: 'Slows everything, including the bugs.' },
    { k: 'dmg', t: 'select', l: 'Damage taken', opts: [[1, '100%'], [.75, '75%'], [.5, '50%'], [.25, '25%']] },
    { k: 'espd', t: 'select', l: 'Bug speed', opts: [[1, '100%'], [.85, '85%'], [.7, '70%']] },
    { k: 'ecount', t: 'select', l: 'Number of bugs', opts: [[1, '100%'], [.75, '75%'], [.5, '50%']] } ] },
];
function applySettings() { document.documentElement.style.setProperty('--ts', ST.text); buildPalettes(); applyAudio(); }
function settingsChanged() { saveSettings(); applySettings(); }
function buildSettings() {
  const root = $('setBody'); root.innerHTML = '';
  for (const grp of SCHEMA) {
    const fs = document.createElement('fieldset'), lg = document.createElement('legend'); lg.textContent = grp.g; fs.appendChild(lg);
    if (grp.note) { const n = document.createElement('p'); n.className = 'note'; n.textContent = grp.note; fs.appendChild(n); }
    for (const it of grp.items) {
      const id = 's_' + it.k, row = document.createElement('div'); row.className = 'row'; let desc = null;
      if (it.d) { desc = document.createElement('small'); desc.id = id + '_d'; desc.textContent = it.d; }
      if (it.t === 'toggle') { const lab = document.createElement('label'), inp = document.createElement('input'), sp = document.createElement('span'); inp.type = 'checkbox'; inp.id = id; inp.checked = !!ST[it.k]; if (desc) inp.setAttribute('aria-describedby', desc.id); inp.addEventListener('change', () => { ST[it.k] = inp.checked; settingsChanged(); }); sp.textContent = it.l; lab.append(inp, sp); row.appendChild(lab); }
      else if (it.t === 'range') { const lab = document.createElement('label'), out = document.createElement('output'), inp = document.createElement('input'); lab.className = 'lb'; lab.htmlFor = id; lab.textContent = it.l + ' '; out.htmlFor = id; lab.appendChild(out); inp.type = 'range'; inp.id = id; inp.min = it.min; inp.max = it.max; inp.step = it.step; const sc = it.sc || 1; inp.value = Math.round(ST[it.k] * sc); const upd = () => { out.textContent = it.fmt(+inp.value); inp.setAttribute('aria-valuetext', it.fmt(+inp.value)); }; upd(); if (desc) inp.setAttribute('aria-describedby', desc.id); inp.addEventListener('input', () => { ST[it.k] = +inp.value / sc; upd(); settingsChanged(); }); row.append(lab, inp); }
      else { const lab = document.createElement('label'), sel = document.createElement('select'); lab.className = 'lb'; lab.htmlFor = id; lab.textContent = it.l; sel.id = id; it.opts.forEach(([v, name], i) => { const o = document.createElement('option'); o.value = i; o.textContent = name; if (v === ST[it.k]) o.selected = true; sel.appendChild(o); }); if (desc) sel.setAttribute('aria-describedby', desc.id); sel.addEventListener('change', () => { ST[it.k] = it.opts[+sel.value][0]; settingsChanged(); }); row.append(lab, sel); }
      if (desc) row.appendChild(desc); fs.appendChild(row);

}
let setReturn = 'title';
function openSettings(from) { setReturn = from; buildSettings(); show('settings'); }
function closeSettings() { show(setReturn); }
function preset(o, msg) { Object.assign(ST, o); settingsChanged(); buildSettings(); announce(msg); }
$('setBtn1').onclick = () => openSettings('title'); $('setBtn2').onclick = () => openSettings('pause'); $('setBtn3').onclick = () => openSettings('over'); $('setBack').onclick = closeSettings;
$('preCalm').onclick = () => preset({ shake: 0, hitstop: false, flash: true, particles: .5 }, 'Calm preset applied');
$('preVis').onclick = () => preset({ contrast: true, bright: .4, text: 1.25, nums: true, arrows: true, caps: true }, 'High-visibility preset applied');
$('preReset').onclick = () => { ST = defaultSettings(); settingsChanged(); buildSettings(); announce('Settings reset to device defaults'); };

/* ---------- input: one thumb to walk, one button to dash ---------- */
function dashWorld(ux, uy) { startDash(ux / IX + uy / IY, uy / IY - ux / IX); }
function dashAuto() { const g = G; if (stick && (stick.dx || stick.dy)) dashWorld(stick.dx, stick.dy); else if (Math.hypot(g.vx, g.vy) > 30) startDash(g.vx, g.vy); else startDash(-Math.cos(g.lampA), -Math.sin(g.lampA)); }
function keyDash() { if (!G || state !== 'play') return; let ix = 0, iy = 0; if (keys.w || keys.arrowup) iy -= 1; if (keys.s || keys.arrowdown) iy += 1; if (keys.a || keys.arrowleft) ix -= 1; if (keys.d || keys.arrowright) ix += 1; if (ix || iy) dashWorld(ix, iy); else dashAuto(); }
addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (state === 'play' && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if ((k === 'shift' || k === ' ') && state === 'play' && !e.repeat) keyDash();
  if ((k === 'p' || k === 'escape') && $('settings').classList.contains('on')) { closeSettings(); e.preventDefault(); } else if (k === 'p' || k === 'escape') togglePause();
  if (k === 'm') { muted = !muted; applyAudio(); } if (state === 'levelup' && ['1', '2', '3'].includes(k)) choose(+k - 1); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, B = dashBtn(), P = pauseBtn(); try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  if (Math.hypot(x - P.x, y - P.y) < P.r + 10) { togglePause(); return; }
  if (!dbtn && Math.hypot(x - B.x, y - B.y) < B.r * 1.25) { dbtn = { id: e.pointerId, ux: 0, uy: 0, d: 0, used: false }; return; }
  if (stick) return; if (ST.fixed) { const S0 = stickBase(); if (Math.hypot(x - S0.x, y - S0.y) > 120) return; stick = { id: e.pointerId, ox: S0.x, oy: S0.y, dx: 0, dy: 0, ux: 0, uy: 0, d: 0 }; return; }
  stick = { id: e.pointerId, ox: x, oy: y, dx: 0, dy: 0, ux: 0, uy: 0, d: 0 }; });
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (dbtn && e.pointerId === dbtn.id) { const B = dashBtn(), dx = x - B.x, dy = y - B.y, d = Math.hypot(dx, dy); dbtn.d = d; if (d > 12) { dbtn.ux = dx / d; dbtn.uy = dy / d; } if (d > 36 && !dbtn.used) { dbtn.used = true; dashWorld(dbtn.ux, dbtn.uy); } return; }
  if (!stick || e.pointerId !== stick.id) return; const RM = 62; let dx = x - stick.ox, dy = y - stick.oy, d = Math.hypot(dx, dy);
  if (d > RM) { if (ST.fixed) { dx = dx / d * RM; dy = dy / d * RM; } else { stick.ox += dx / d * (d - RM); stick.oy += dy / d * (d - RM); dx = x - stick.ox; dy = y - stick.oy; } d = Math.hypot(dx, dy) || 1; }
  const on = d > ST.dead ? 1 : 0, ux = dx / (d || 1), uy = dy / (d || 1); stick.dx = ux * on; stick.dy = uy * on; stick.ux = ux; stick.uy = uy; stick.d = d; });
const endPtr = e => { if (dbtn && e.pointerId === dbtn.id) { if (!dbtn.used && state === 'play') { if (dbtn.d > 14) dashWorld(dbtn.ux, dbtn.uy); else dashAuto(); } dbtn = null; return; } if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- loop ---------- */
let emaDt = 16.7, lastQ = 0, fpsN = 0, fpsT = 0; const fpsEl = $('fps'), showFps = /[?&]fps/.test(location.search); if (showFps) fpsEl.style.display = 'block';
function frame(now) {
  requestAnimationFrame(frame); const raw = now - lastT, dt = clamp((raw || 0) / 1000, 0, .05); lastT = now;
  if (raw < 100 && raw > 0) { emaDt = emaDt * .96 + raw * .04; if (now - lastQ > 2500 && emaDt > 21 && Q > .5) { Q = Math.max(.5, Q - .17); lastQ = now; emaDt = 16.7; resize(); } }
  if (showFps) { fpsN++; if (now - fpsT > 500) { fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT)) + ' fps  q' + Q.toFixed(2) + '  bugs ' + G.en.length; fpsN = 0; fpsT = now; } }
  if (!ST.hitstop) G.freeze = 0;
  if (G.freeze > 0 && state === 'play') G.freeze -= dt; else if (state === 'play' || state === 'title') update(dt * (state === 'play' ? ST.tscale : 1));
  render();
}
applySettings(); resize(); newGame(true);
requestAnimationFrame(t => { lastT = t; frame(t); });
